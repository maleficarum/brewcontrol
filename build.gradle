plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.johnrengelman.shadow' version "8.1.1"
	id "org.sonarqube" version "6.1.0.5360"
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2024.0.0")
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
	apply plugin: 'java-library-distribution'
	apply plugin: 'com.github.johnrengelman.shadow'

	distZip.shouldRunAfter(build)

	group = 'mx.maleficarum'
	version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    bootJar {
        enabled = true
    }

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}	

	sonar {
        properties {
            property "sonar.sources", "src"
			property "sonar.projectKey", "brewcontrol"
        	property "sonar.projectName", "brewcontrol"
        	property "sonar.host.url", "http://192.168.100.58:9000"
        	property "sonar.login", System.getenv("SONAR_TOKEN")
        	property "sonar.java.source", "21"
			property "sonar.sources", "src/main/java"
//        	property "sonar.tests", "src/test/java"
        	property "sonar.sourceEncoding", "UTF-8"
        
        	// Binary directories
	        property "sonar.java.binaries", "build/classes/java/main"
    	    //property "sonar.java.test.binaries", "build/classes/java/test"
        
        	// Test reports
        	property "sonar.junit.reportPaths", "build/test-results/test"
        	property "sonar.jacoco.reportPaths", "build/jacoco/test.exec"
        	property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        
        	// Exclusions (if needed)
        	property "sonar.exclusions", """
            	**/*Application.java,
            	**/*ApplicationTests.java
        	"""        	
        	property "sonar.coverage.jacoco.xmlReportPaths", 
            layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml").get().asFile
    			
        }
    }		
}

subprojects {

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
 		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'		
		implementation 'javax.persistence:javax.persistence-api:2.2'

		//implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
		//implementation group: 'org.json', name: 'json', version: '20240303'

	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		}
	}

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }	

	tasks.named('test') {
		useJUnitPlatform()
		testLogging {
			showStandardStreams = true
		}
	}	
}